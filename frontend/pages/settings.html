<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings | SQL Migrator</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/sidebar.css" />
  <link rel="stylesheet" href="../css/settings.css" />
</head>
<body>
  <div id="sidebar-container"></div>
  <div class="page-content">
    <header class="page-header">
      <div class="header-content">
        <h1>SQL Migrator</h1>
        <p>Database Migration & Management Platform</p>
      </div>
    </header>
    <main class="content-inner settings-shell">
      <div class="settings-topbar" style="display:flex; justify-content:space-between; align-items:center; gap:16px;">
        <div>
          <h2 id="settings-page-title" style="margin:0; font-size:1.1rem; font-weight:500;">Settings</h2>
        </div>
        <div id="settings-top-actions" style="display:flex; gap:12px; align-items:center;"></div>
      </div>

      <div class="tabs-bar" style="margin-top:18px; display:flex; gap:8px; align-items:center;">
        <button class="tab-pill" data-tab="my-account">My Account</button>
        <button class="tab-pill" data-tab="user-settings">User Settings</button>
        <button class="tab-pill" data-tab="admin-settings">Admin Settings <span class="badge-amber" style="margin-left:8px;">Admin only</span></button>
      </div>

      <div class="settings-body" style="display:grid; grid-template-columns:170px 1fr; gap:20px; margin-top:18px;">
        <aside id="settings-subnav" class="card" style="padding:12px;">
          <!-- sub navigation injected here -->
        </aside>
        <section id="settings-content" class="card" style="padding:18px;">
          <!-- settings subpage content rendered here -->
          <div id="settings-placeholder">
            <p class="small-text">Select a settings category from the left to begin.</p>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div id="password-modal" class="modal-overlay hidden" style="position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:9999;">
    <div class="card" style="width:400px; padding:24px;">
      <h3 style="margin-top:0;">Change Password</h3>
      <form onsubmit="submitPasswordChange(event)" id="password-form">
        <div class="input-group" style="margin-bottom:12px;">
          <label>Current Password</label>
          <input type="password" id="cp_current" required />
        </div>
        <div class="input-group" style="margin-bottom:12px;">
          <label>New Password</label>
          <input type="password" id="cp_new" required minlength="6" />
        </div>
        <div class="input-group" style="margin-bottom:20px;">
          <label>Confirm New Password</label>
          <input type="password" id="cp_confirm" required minlength="6" />
        </div>
        <div style="display:flex; justify-content:flex-end; gap:12px;">
          <button type="button" class="button-secondary" onclick="closePasswordModal()">Cancel</button>
          <button type="submit" class="button-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/settings.js"></script>
  <script>initSettingsPage();</script>
</body>
</html>
