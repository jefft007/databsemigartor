<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Dashboard | SQL Migrator</title>

  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/sidebar.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
</head>
<body>

  <div id="sidebar-container"></div>

  <div class="page-content">
    <header class="page-header">
      <div class="header-content">
        <h1>SQL Migrator</h1>
        <p>Database Migration & Management Platform</p>
      </div>
    </header>

    <main class="content-inner">

      <!-- Dashboard Summary -->
      <section class="grid-two">
        <section class="card">
          <div class="header-bar">
            <h2>Dashboard Summary</h2>
          </div>
          <div class="dashboard-summary" id="dashboard-summary"></div>
        </section>

        <section class="card">
          <div class="header-bar">
            <h2>Quick Actions</h2>
          </div>
          <div class="quick-actions" id="quick-actions"></div>
        </section>
      </section>

      <!-- Migration Overview -->
      <section class="card">
        <div class="header-bar">
          <h2>Migration Overview</h2>
        </div>
        <div class="chart-box compact-chart">
          <canvas id="migration-trends-chart" height="180"></canvas>
        </div>
      </section>

      <!-- Recent Activity -->
      <section class="card table-card" style="margin-top: 24px;">
        <div class="card-header">
          <h3>Recent Activity</h3>
        </div>
        <table class="data-table">
          <thead>
            <tr>
              <th>User</th>
              <th>Email</th>
              <th>Conversion</th>
              <th>Status</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="admin-recent-activity">
            <!-- Dynamically populated -->
          </tbody>
        </table>
      </section>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/dashboard.js"></script>

  <script>
    initDashboardPage();
  </script>

</body>
</html>
